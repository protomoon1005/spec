[project]
name = "spec-backend"
version = "0.1.0"
description = "국내 ETF 모의운용 졸업작품 — 공통 인프라 백엔드 (FastAPI + Celery)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_ollama: 호스트에 뜬 Ollama(qwen3:8b)가 필요한 실통합 테스트. CI는 -m 'not requires_ollama'로 제외한다.",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
