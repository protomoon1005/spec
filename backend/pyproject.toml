[project]
name = "spec-backend"
version = "0.1.0"
description = "한국어 투자 전략 명세화 · 백테스트 서비스 졸업작품 — 백엔드 (FastAPI + Celery)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# 백테스트 러너 전용. app/backtest/ 가 numpy·pandas 를 최상단에서, vectorbt 를
# run() 안에서 import 하고 가격 수집 스크립트가 FinanceDataReader 를 쓴다.
# base 에 넣지 않은 이유: api 서비스는 러너를 import 하지 않는다.
# CI 는 .[dev] 만 설치하므로 이 extra 가 필요한 테스트는 requires_backtest 로 막는다.
backtest = [
    "numpy>=1.26",
    "pandas>=2.2",
    "vectorbt>=1.1",
    "finance-datareader>=0.9",
    # vectorbt 가 plotly 에 상한을 두지 않아 최신이 잡히는데, 7.x 는 import 자체가 깨진다:
    #   ValueError: Invalid property ... 'scattermapbox'
    # 상한이 없으면 Dockerfile 이 이 extra 를 깔아도 import vectorbt 가 실패한다.
    # 실측 — 7.1.0 실패(M3) · 6.8.0 정상(M4, parity 5건 통과) · 5.24.1 정상(M3).
    # 6.x 가 도는 것이 확인됐으므로 5.x 까지 내리지 않고 7 만 막는다.
    "plotly<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_ollama: 호스트에 뜬 Ollama(qwen3:8b)가 필요한 실통합 테스트. CI는 -m 'not requires_ollama'로 제외한다.",
    "requires_backfill: 외부 소스(FDR·ECOS 등)에서 백필해 둔 실데이터가 DB에 있어야 하는 테스트. CI는 시드만 넣은 새 DB라 -m 'not requires_backfill'로 제외한다.",
    "requires_backtest: 백테스트 의존성(numpy·pandas·vectorbt)이 필요한 테스트. CI는 .[dev]만 설치하므로 -m 'not requires_backtest'로 제외한다.",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
