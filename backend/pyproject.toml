[project]
name = "spec-backend"
version = "0.1.0"
description = "국내 ETF 모의운용 졸업작품 — 공통 인프라 백엔드 (FastAPI + Celery)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# M4(백테스트 러너) 전용. app/backtest/ 가 numpy·pandas 를 최상단에서, vectorbt 를
# run() 안에서 import 하고 scripts/build_universe.py 가 FinanceDataReader 를 쓴다.
# base 에 넣지 않은 이유: api 서비스는 이 모듈을 쓰지 않고, pandas 를 base 로 올리는
# 것은 의존성 지형을 바꾸는 결정이라 팀이 정할 일이다(plans/M3_3관점판단.md 참고).
# CI 는 .[dev] 만 설치하므로 이 extra 가 필요한 테스트는 requires_backtest 로 막는다.
backtest = [
    "numpy>=1.26",
    "pandas>=2.2",
    "vectorbt>=1.1",
    "finance-datareader>=0.9",
    # vectorbt 가 plotly 에 상한을 두지 않아 최신이 잡히는데, 7.x 는 import 자체가 깨진다:
    #   ValueError: Invalid property ... 'scattermapbox'
    # 상한이 없으면 Dockerfile 이 이 extra 를 깔아도 import vectorbt 가 실패한다.
    # 실측 — 7.1.0 실패(M3) · 6.8.0 정상(M4, parity 5건 통과) · 5.24.1 정상(M3).
    # 6.x 가 도는 것이 확인됐으므로 5.x 까지 내리지 않고 7 만 막는다.
    "plotly<7",
]
# M3(판단 계층) 전용. 학습·추론 의존성이라 api 서비스에는 런타임에 필요 없지만,
# worker(daily_judge·train_model)에는 필요하다. Dockerfile을 쪼개지 않기로 했으므로
# (2026-09-12 팀 합의) 단일 이미지에 같이 들어간다.
# 시장분석 관점은 LightGBM + scikit-learn(isotonic) + SHAP 이라 torch 가 필요 없다.
# 뉴스 임베딩·KF-DeBERTa 용이던 torch·transformers·feedparser 와 pandas-ta(features.py 는
# stdlib 구현), 아무도 import 하지 않던 fredapi(ingest_macro.py 는 urllib 직접 호출),
# 동작하지 않던 pykrx(KRX 계정 요구, 2026-09-12 실측 400 LOGOUT)는
# 데모 경량화(2026-09-19)로 뺐다. pre-demo-refactor 태그에서 복구할 수 있다.
# 버전 핀은 실제 학습 코드를 짜면서 근거가 생길 때 박는다.
#
# 설치:
#   pip install -e ".[dev,ml]"
ml = [
    "lightgbm",
    "shap",
    "scikit-learn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_ollama: 호스트에 뜬 Ollama(qwen3:8b)가 필요한 실통합 테스트. CI는 -m 'not requires_ollama'로 제외한다.",
    "requires_ml: ML 의존성(lightgbm·shap·scikit-learn 등)이 필요한 테스트. CI는 -m 'not requires_ml'로 제외한다.",
    "requires_backfill: 외부 소스(FDR·ECOS 등)에서 백필해 둔 실데이터가 DB에 있어야 하는 테스트. CI는 시드만 넣은 새 DB라 -m 'not requires_backfill'로 제외한다.",
    "requires_backtest: 백테스트 의존성(numpy·pandas·vectorbt)이 필요한 테스트. CI는 .[dev]만 설치하므로 -m 'not requires_backtest'로 제외한다.",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
