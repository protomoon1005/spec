[project]
name = "spec-backend"
version = "0.1.0"
description = "TODO(7단계 이후): FastAPI + Celery 의존성 채움. 지금은 3단계(Alembic)에 필요한 것만 채움"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
