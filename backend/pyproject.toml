[project]
name = "spec-backend"
version = "0.1.0"
description = "국내 ETF 모의운용 졸업작품 — 공통 인프라 백엔드 (FastAPI + Celery)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "httpx>=0.27",
    # 국내 지수·시세 적재(scripts/ingest_index·ingest_prices·build_universe)용. 인증 없이
    # 받을 수 있는 경로라 M3 가 상시 쓴다. pandas·numpy 가 간접 의존으로 딸려 온다.
    "finance-datareader",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# M3(판단 계층) 전용. 학습·추론 의존성이라 api 서비스에는 런타임에 필요 없지만,
# worker(daily_judge·train_model)에는 필요하다. Dockerfile을 쪼개지 않기로 했으므로
# (2026-09-12 팀 합의) 단일 이미지에 같이 들어간다.
# 시장분석 관점은 LightGBM + scikit-learn(isotonic) + SHAP 이라 torch 가 필요 없다.
# 뉴스 임베딩·KF-DeBERTa 용이던 torch·transformers·feedparser 와 pandas-ta(features.py 는
# stdlib 구현), 동작하지 않던 pykrx(KRX 계정 요구, 2026-09-12 실측 400 LOGOUT)는
# 데모 경량화(2026-09-19)로 뺐다. pre-demo-refactor 태그에서 복구할 수 있다.
# 버전 핀은 실제 학습 코드를 짜면서 근거가 생길 때 박는다.
#
# 설치:
#   pip install -e ".[dev,ml]"
ml = [
    "lightgbm",
    "shap",
    "scikit-learn",
    "fredapi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_ollama: 호스트에 뜬 Ollama(qwen3:8b)가 필요한 실통합 테스트. CI는 -m 'not requires_ollama'로 제외한다.",
    "requires_ml: ML 의존성(lightgbm·torch·transformers 등)이 필요한 테스트. CI는 -m 'not requires_ml'로 제외한다.",
    "requires_backfill: 외부 소스(FDR·ECOS 등)에서 백필해 둔 실데이터가 DB에 있어야 하는 테스트. CI는 시드만 넣은 새 DB라 -m 'not requires_backfill'로 제외한다.",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
