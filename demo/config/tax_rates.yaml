# 세율 표 (docs/strategy-spec-v0.2.md "세금과 배당", DB tax_rates 표의 데모용 파일판)
# 백테스트는 거래한 날짜(매도 체결일)에 유효한 행의 세율을 쓴다. 표에 없는 날짜·분류는 오류로 멈춘다.
#
# applies_to: KOSPI_STOCK · KOSDAQ_STOCK · ETF_DOMESTIC_EQUITY · ETF_OTHER
# tax_kind:   TRANSACTION(증권거래세, 매도금액에) · RURAL(농어촌특별세, 매도금액에)
#             GAIN(차익에 매기는 배당소득세) · DIVIDEND(배당소득세 — 데모는 배당 미반영이라 쓰지 않음)
# rate: 0.0015 = 0.15%
#
# 코스피 2023·2024 의 거래세/농특세 나눔은 v0.2 표의 합계(0.20%·0.18%)에서 농특세 0.15%를 뺀 값이다
# (v0.2: "코스피는 여기에 농어촌특별세 0.15%가 더해집니다"). 2026~ 는 v0.2 표의 "2026~" 를 2026-01-01 부터로 적었다
# (v0.2 본문: 현행 조문 2026-01-02 시행. 1월 1일은 휴장일이라 결과는 같다).

rates:
