  - {applies_to: KOSPI_STOCK, tax_kind: TRANSACTION, rate: 0.0005, valid_from: 2026-01-01, valid_to: null,       legal_basis: "증권거래세법 시행령 제5조, 2026-01-02 시행 조문 (v0.2 표: 거래세 0.05%)"}
