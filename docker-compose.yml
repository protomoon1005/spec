name: spec

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - .env
  # Linux Docker Engine 은 host.docker.internal 을 자동 제공하지 않는다 — 호스트 Ollama 에 붙으려면 필요.
  # Docker Desktop 에서는 원래 있는 값이라 영향 없다.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    LLM_BACKEND: ${LLM_BACKEND}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    OLLAMA_MODEL: ${OLLAMA_MODEL}
    VLLM_BASE_URL: http://vllm:8001
    VLLM_MODEL: ${VLLM_MODEL}
  volumes:
    - .:/repo
    - ./backend:/app
    - /app/__pycache__
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # quay.io/minio 도 익명 pull 을 막아서(2026-10-04, 401) chainguard 빌드로 옮긴다.
  # 이 이미지엔 curl 이 없다 — healthcheck 는 bash /dev/tcp 로 같은 엔드포인트를 본다(Host 헤더 필수).
  # mc 도 같은 이미지에 들어 있어 minio-init 이 같은 이미지를 쓴다.
  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && [[ $$(head -1 <&3) == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_MODELS} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_REPORTS}
      "
    restart: "no"

  api:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend-common
    command: celery -A app.workers worker --loglevel=info

  beat:
    <<: *backend-common
    command: celery -A app.workers beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: --model ${VLLM_MODEL} --guided-decoding-backend outlines
    ports:
      - "${VLLM_PORT}:8001"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  miniodata:
  hf_cache:
