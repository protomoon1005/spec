name: CI

# ubuntu-latest 러너에서 돈다 — bash 전용 스텝을 써도 된다(로컬 PowerShell
# 제약은 tasks.ps1에만 적용된다, spec/CLAUDE.md 참고).
#
# docs/infra-spec.md 10단계 수용 기준: "lint(ruff) + 마이그레이션 왕복 + smoke
# test가 PR에서 돈다"를 그대로 구현한다. check_asof_guard.py와 pytest는 그
# smoke test 흐름 안에서 각각 별도 스텝으로 명시적으로 돈다.
#
# 이 러너에는 GPU도 Ollama/vLLM도 없다 — smoke_test.py의 GPU/CPU 프로필
# 항목은 코드 자체가 항상 SKIP이고, LLM 백엔드 헬스체크는
# SMOKE_REQUIRE_LLM_HEALTHY=false로 판정에서만 뺀다(DB/Redis/MinIO는 그대로
# 필수). M1의 LLM 실측은 로컬(Ollama)/GPU 팀원(vLLM) 몫이다.

on:
  pull_request:
  push:
    branches: [main]

# DATABASE_URL·REDIS_URL을 워크플로 전역 env에 두지 않는다. 전역에 두면 러너 셸
# 환경변수가 되고, docker compose는 `${DATABASE_URL}`을 치환할 때 셸 환경변수를
# .env보다 먼저 쓴다 — api·worker 컨테이너가 localhost로 붙어 /health가 깨졌다
# (2026-09-08 첫 CI 실패: worker "Cannot connect to redis://localhost:6379").
# 호스트에서 도는 단계(alembic·시드·asof guard·pytest·smoke)에만 step-level로 준다.
# 값이 여러 스텝에 반복되는 것은 의도다 — 전역으로 올리지 마라.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ml extra(.[dev,ml])는 일부러 설치하지 않는다 — 매 PR마다 torch를 받으면
      # CI 시간이 크게 는다. ML이 필요한 테스트는 requires_ml 마커로 빠진다
      # (2026-09-12 팀 합의, 현서의 requires_ollama 선례를 따른다).
      - name: 백엔드 의존성 설치
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: .env 준비
        run: cp .env.example .env

      - name: 전 스택 기동 (gpu/cpu 프로필 없이 — vllm/ollama 컨테이너는 안 올린다)
        run: docker compose up -d --wait postgres redis minio api worker frontend prometheus grafana

      # 수용 기준 "마이그레이션 왕복" — upgrade → downgrade base → upgrade.
      # 시드는 멱등이 아니므로 왕복을 끝낸 뒤 한 번만 넣는다.
      - name: Alembic 마이그레이션 왕복 (메인 spec DB)
        env:
          DATABASE_URL: postgresql+psycopg://spec:spec_dev_password@localhost:5432/spec
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head

      - name: 시드 적재 (db/seeds/*.sql)
        env:
          DATABASE_URL: postgresql+psycopg://spec:spec_dev_password@localhost:5432/spec
          REDIS_URL: redis://localhost:6379/0
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client
          for f in db/seeds/*.sql; do
            echo "seeding $f"
            PGPASSWORD=spec_dev_password psql -h localhost -U spec -d spec -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: check_asof_guard.py
        env:
          DATABASE_URL: postgresql+psycopg://spec:spec_dev_password@localhost:5432/spec
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/check_asof_guard.py

      # requires_backfill: 외부 소스에서 백필한 실데이터가 DB에 있어야 하는 테스트.
      # 이 러너의 DB는 시드만 넣은 새 DB라 뺀다(로컬 백필 DB에서는 돈다).
      - name: pytest (requires_ollama · requires_ml · requires_backfill 제외)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://spec:spec_dev_password@localhost:5432/spec
          REDIS_URL: redis://localhost:6379/0
        run: pytest -m "not requires_ollama and not requires_ml and not requires_backfill" -q

      - name: smoke_test.py
        env:
          DATABASE_URL: postgresql+psycopg://spec:spec_dev_password@localhost:5432/spec
          REDIS_URL: redis://localhost:6379/0
          SMOKE_REQUIRE_LLM_HEALTHY: "false"
        run: python scripts/smoke_test.py

      - name: 컨테이너 로그 (실패 시 진단용)
        if: failure()
        run: docker compose logs --tail 200

      - name: 정리
        if: always()
        run: docker compose down -v
