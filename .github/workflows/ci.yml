name: CI

on:
  pull_request:
  push:
    branches: [main]

# DATABASE_URL·REDIS_URL을 워크플로 전역 env에 두지 않는다. 전역에 두면 러너 셸
# 환경변수가 되고, docker compose는 `${DATABASE_URL}`을 치환할 때 셸 환경변수를
# .env보다 먼저 쓴다 — api·worker 컨테이너가 localhost로 붙어 /health가 깨진다.
# 컨테이너 안에서 도는 단계는 compose environment가 이미 올바른 값을 주므로
# step-level env도 필요 없다.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env 준비
        run: cp .env.example .env

      - name: 스택 기동
        run: docker compose up -d --wait postgres redis minio api worker frontend

      - name: ruff
        run: docker compose exec api ruff check .

      - name: 시드 적재 (db/seeds/*.sql)
        run: |
          for f in db/seeds/*.sql; do
            echo "seeding $f"
            docker compose exec -T postgres psql -U spec -d spec -v ON_ERROR_STOP=1 < "$f"
          done

      - name: check_asof_guard.py
        run: docker compose exec api python /repo/scripts/check_asof_guard.py

      - name: pytest (requires_ollama · requires_ml · requires_backfill 제외)
        run: docker compose exec api pytest -m "not requires_ollama and not requires_ml and not requires_backfill" -q

      - name: smoke_test.py
        run: docker compose exec -e SMOKE_REQUIRE_LLM_HEALTHY=false api python /repo/scripts/smoke_test.py

      - name: 컨테이너 로그 (실패 시 진단용)
        if: failure()
        run: docker compose logs --tail 200

      - name: 정리
        if: always()
        run: docker compose down -v
