# Grafana가 기동 시 자동으로 등록하는 데이터소스. api가 prometheus-fastapi-
# instrumentator로 노출하는 /metrics를 prometheus가 스크레이프하고, grafana는
# 그 prometheus를 조회한다 (docker-compose.yml 서비스명 기준 URL).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
